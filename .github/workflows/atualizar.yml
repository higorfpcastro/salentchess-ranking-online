name: Atualizar ranking SalentChess

on:
  schedule:
    - cron: '45 1 * * *'  # 22h45 Brasília (UTC-3)

  workflow_dispatch:

concurrency:
  group: atualizar-ranking-salentchess
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sincronizar com o repositório remoto
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar script de atualização
        run: |
          python itaberabao-ranking/python/atualizar.py

      - name: Commit e push dos dados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add itaberabao-ranking/site/*.json

          git diff --cached --quiet || git commit -m "Atualização automática SalentChess"

          git push origin main
