name: Atualizar ranking SalentChess

on:
  schedule:
    - cron: '01 22 * * *'  # 19h01 Brasília (UTC-3)

  workflow_dispatch:

concurrency:
  group: atualizar-ranking-salentchess
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  build:
    runs-on: ubuntu-24.04   # fixo (antes: ubuntu-latest, que passou a apontar para o Ubuntu 26)

    steps:

      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sincronizar com o repositório remoto
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # fixo (antes: '3.x', que pega sempre o Python mais novo)

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip list | grep -i -E "pandas|numpy|requests"   # registra as versões no log

      - name: Rodar script de atualização
        run: |
          python -X faulthandler -u itaberabao-ranking/python/atualizar.py

      - name: Commit e push dos dados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add itaberabao-ranking/site/*.json

          git diff --cached --quiet || git commit -m "Atualização automática SalentChess"

          git push origin main
